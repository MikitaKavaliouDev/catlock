[workspace]
resolver = "2"
members = [
    "crates/catlock-core",
    "crates/catlock-input",
    "crates/catlockd",
    "crates/catlock",
    "spike",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Mikita Kavaliou"]

[workspace.dependencies]
evdev = "0.13"
nix = "0.29"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = "5"
ksni = "0.2"
notify-rust = "4"